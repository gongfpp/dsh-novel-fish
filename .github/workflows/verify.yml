name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify
      - name: Check committed browser bundle and notices
        run: git diff --exit-code -- lib/client.js THIRD-PARTY-NOTICES.txt
      - run: pnpm pack --pack-destination /tmp/novel-fish-package
